name: kafka-spark-metabase

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}

x-http-healthcheck: &http-healthcheck
  test: ["CMD-SHELL", "python3 -c \"import os, urllib.request; urllib.request.urlopen(os.environ['HEALTHCHECK_URL'])\""]
  interval: 5s
  timeout: 5s

networks:
  pipeline-network:
    driver: bridge

volumes:
  postgres-data:
  kafka-data:
  spark-checkpoint:
  metabase-data:

services:
  postgres:
    image: postgres:18
    container_name: postgres
    networks: [pipeline-network]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      <<: *postgres-env
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:8.3.0
    container_name: kafka
    networks: [pipeline-network]
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 10

  schema-registry:
    image: confluentinc/cp-schema-registry:8.3.0
    container_name: schema-registry
    networks: [pipeline-network]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${SCHEMA_REGISTRY_PORT:-8081}:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      HEALTHCHECK_URL: http://localhost:8081/subjects
    healthcheck:
      <<: *http-healthcheck
      retries: 15

  consumer:
    build:
      context: .
      target: consumer
    container_name: consumer
    networks: [pipeline-network]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      producer:
        condition: service_started
    environment:
      <<: *postgres-env
      POSTGRES_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      TOPIC: coingecko.markets
    volumes:
      - spark-checkpoint:/checkpoint

  producer:
    build:
      context: .
      target: producer
    container_name: producer
    networks: [pipeline-network]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      COINGECKO_API_URL: ${COINGECKO_API_URL:?Set COINGECKO_API_URL in .env}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:?Set POLL_INTERVAL_SECONDS in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      TOPIC: coingecko.markets

  metabase:
    image: metabase/metabase:v0.64.3.4
    container_name: metabase
    networks: [pipeline-network]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${METABASE_PORT:-3000}:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data

  akhq:
    image: tchiotludo/akhq:0.28.0
    container_name: akhq
    networks: [pipeline-network]
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "${AKHQ_PORT:-8080}:8080"
    volumes:
      - ./akhq/application.yml:/app/application.yml
